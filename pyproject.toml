[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mindstrat-mcp"
version = "0.1.0"
description = "Drive the MindStrat desktop trading app from Claude Code, and write strategies in its MSF format."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "MindStrat" }]
keywords = ["mcp", "model-context-protocol", "trading", "backtesting", "mindstrat"]

# Deliberately small. This server talks HTTP to the app's local backend; it does
# not import the app, so it needs none of its scientific stack.
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27",
    "psutil>=5.9",
]

[project.scripts]
mindstrat-mcp = "mindstrat_mcp.server:main"

[project.urls]
Homepage = "https://mindstrat.ai"

[tool.hatch.build.targets.wheel]
packages = ["mindstrat_mcp"]

# manual/ and appdata_snapshot.json live inside the package, so they are picked
# up as package data without a force-include. They have to ship: the manual used
# to be read out of the app's repo, which works on a developer's checkout and
# fails on a customer's machine — the resource read raises and the model writes
# strategies without the rules it believes it read.
